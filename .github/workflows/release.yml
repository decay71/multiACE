name: Build release tarball

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose tarball
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          OUT="dist/release"
          mkdir -p "$OUT"
          # The whole multiace/ tree at its repo layout (same as the
          # release recipe): the updater runs install_multiace.sh from
          # inside, and the installer needs deploy/, config/, tools/,
          # i18n/ and web/ next to it.
          tar -czf "$OUT/multiace-${TAG}.tar.gz" multiace/
          (cd "$OUT" && sha256sum "multiace-${TAG}.tar.gz" \
              > "multiace-${TAG}.tar.gz.sha256")
          ls -la "$OUT/"

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/release/multiace-*.tar.gz
            dist/release/multiace-*.tar.gz.sha256
          generate_release_notes: true
