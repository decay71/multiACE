name: Build and test multiACE packages

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit SHA to build as a test artifact (no release is published)
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}

      - name: Record exact source commit
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate managed package sources
        run: |
          python -m py_compile \
            multiace/klipper/extras/ace.py \
            multiace/klipper/extras/ace_gen1_tunnel.py \
            multiace/web/backend/i18n_path.py \
            multiace/web/backend/main.py \
            multiace/tools/post_process_virtual_toolheads.py \
            multiace/managed/build_package.py \
            multiace/managed/tests/test_package.py \
            multiace/managed/tests/test_i18n_path.py
          node --check multiace/web/frontend/app.js
          bash -n \
            multiace/install_multiace.sh \
            multiace/uninstall_multiace.sh \
            multiace/tools/multiace_update.sh \
            multiace/config/extended/multiace/ace_mode_switch.sh \
            multiace/web/deploy/S98multiace-web
          bash multiace/managed/tests/test_managed_guards.sh
          bash multiace/managed/tests/test_updater_asset_selection.sh
          python -m unittest discover -s multiace/managed/tests -v

          python multiace/managed/build_package.py \
            --output "$RUNNER_TEMP/multiace-managed-check.tar.gz"
          (cd "$RUNNER_TEMP" && \
            sha256sum --check multiace-managed-check.tar.gz.sha256)

  package:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated source
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}

      - name: Build packages and metadata
        shell: bash
        run: |
          set -euo pipefail
          OUT="dist/release"
          mkdir -p "$OUT"
          VERSION="$(tr -d '\r\n' < multiace/VERSION)"
          SOURCE_SHA="$(git rev-parse HEAD)"
          test -n "$VERSION"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            BUILD_KIND="manual-test-artifact"
            PACKAGE_TAG="v$VERSION-test-$GITHUB_RUN_ID"
          else
            TAG="$GITHUB_REF_NAME"
            test "$TAG" = "v$VERSION"
            BUILD_KIND="stable-tag"
            PACKAGE_TAG="$TAG"
          fi

          # Keep the existing standalone archive layout required by its installer.
          tar -czf "$OUT/multiace-$PACKAGE_TAG.tar.gz" multiace/
          (cd "$OUT" && sha256sum "multiace-$PACKAGE_TAG.tar.gz" \
              > "multiace-$PACKAGE_TAG.tar.gz.sha256")
          python multiace/managed/build_package.py \
            --output "$OUT/multiace-managed-$VERSION.tar.gz"

          {
            printf 'Build kind: %s\n' "$BUILD_KIND"
            printf 'Version: %s\n' "$VERSION"
            printf 'Source commit: %s\n' "$SOURCE_SHA"
            printf 'Workflow run: https://github.com/%s/actions/runs/%s\n' \
              "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$OUT/build-info.txt"

          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            {
              printf '## Release packages\n\n'
              printf -- '- Standalone installer: multiace-%s.tar.gz and its SHA-256 checksum.\n' "$TAG"
              printf -- '- Platform-managed payload: multiace-managed-%s.tar.gz and its SHA-256 checksum.\n\n' "$VERSION"
              printf 'Built from source commit %s (https://github.com/%s/commit/%s).\n' \
                "$SOURCE_SHA" "$GITHUB_REPOSITORY" "$SOURCE_SHA"
            } > "$OUT/release-prefix.md"
          fi
          ls -la "$OUT/"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multiace-packages-${{ github.run_id }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@v4
        with:
          name: multiace-packages-${{ github.run_id }}
          path: dist/release

      - name: Publish stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ needs.validate.outputs.source_sha }}
          name: ${{ github.ref_name }}
          body_path: dist/release/release-prefix.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/release/*.tar.gz
            dist/release/*.tar.gz.sha256
