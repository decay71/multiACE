[save_variables]
filename: /home/lava/printer_data/config/extended/multiace/ace_vars.cfg
[ace]
# Units are found and placed on their own (Config -> Devices in the web
# UI, MMU 1-4): no count to set. ace_device_count and v2_order from older
# configs are still read; the first start without a saved unit table uses
# the count as its only expectation.
#
# Feature switches (ACE_SET_* / web) WRITE their line in this file
# directly; it is the only store. PERSIST=0 on a setter = RAM only until
# restart. Exceptions kept in save_variables: mode, head wiring (manual /
# feeder / MMU per head) and the per-unit auto-dry settings.

# ===== Drivers and ports =====
# Each unit type has its own driver and switch; a driver that is off runs
# no discovery, probes no port and connects nothing. A new, untested driver
# ships off (opt-in at your own risk).
#enable_ace_v1: true
enable_ace_v2: true
# Creality CFS Nano on a USB-RS485 dongle, untested: shows presence per
# slot, loads and unloads are not wired yet. Only one MMU driver should
# probe a dongle: leave v2_extra_usb_ids and v2_probe_generic_usb unset.
#enable_cfs: false
# USB VID:PID of the CFS Nano dongle (each such port is probed before use).
#cfs_usb_ids: 1a86:7523
# Extra USB VID:PID values accepted as an ACE 2 (generic USB-RS485 adapter
# instead of the Anycubic cable). Listing one does not enable probing.
#v2_extra_usb_ids: 1a86:7523
# Identity probing of generic USB-RS485 adapters, opt-in.
#v2_probe_generic_usb: true
# Ports the discovery must never open, e.g. a Klipper MCU that enumerates
# like an ACE 2. Comma/space separated /dev paths; every [mcu *] serial is
# excluded automatically.
#exclude_ports: /dev/serial/by-id/usb-foo
# Seconds to wait for the assigned units at startup (0 = no wait).
#startup_wait: 20.0

# ===== Language and display =====
# en | de | zh. Live: web Config tab / MULTIACE_SET_LANGUAGE LANG=
language: en
# 1 = MMU, slot and head numbers in UI and messages count from 1. G-code
# parameters (ACE=, SLOT=, HEAD=) always count from 0.
display_index_base: 1
# false = keep your own Fluidd/Mainsail macro layout.
macro_layout_enabled: true
# Upload cap (MB) of the "Send to multiACE" slicer inbox.
#inbox_max_mb: 256

# ===== Load and unload =====
# Speeds in mm/s (the ACE 2 accepts at most 100).
feed_speed: 80
retract_speed: 80
# mm from the MMU to the toolhead sensor (the feed stops at the sensor)
# and mm pulled back on a full unload. Per-unit and per-slot values live
# in [ace N] sections, written by the Calibration tab.
load_length: 2100
retract_length: 1950
# Hot press after the load heat that pushes the tip into the extruder
# gears. Also bounds the background engine's ACE Pro press. 0 = off.
seat_overshoot_length: 30
# Feed attempts until the toolhead sensor triggers, mm pulled back between.
load_retry: 3
load_retry_retract: 50
# Flow check after the load: retries, each pulls back and pushes again.
# wiggle_scheme picks per retry E (extruder, extrusion_retry_retract mm)
# or A (with MMU push, extrusion_retry_retract_a mm).
extrusion_retry: 7
extrusion_retry_retract: 30
extrusion_retry_retract_a: 50
wiggle_scheme: EAEAEAE
# Verified unload attempts before the print pauses.
unload_retry: 3
# ACE 2 jam check (sent at connect): check length and error length in mm,
# 3-254, error <= check. 254 / 254 = most tolerant.
v2_feed_check_check_length: 254
v2_feed_check_error_length: 254

# ===== Swap =====
# Swap heat when neither the print nor the material gives one.
swap_default_temp: 250
# mm pulled back on a swap (0 = retract_length).
swap_retract_length: 900
# Fixed purge after a swap load in mm (0 = stock 80 mm).
swap_purge_length: 0
# false = ignore the preflight's per-pair purge stamps, fixed purge again
# (also on already-stamped files). Live: ACE_SET_PURGE MATRIX=0|1
purge_matrix: true
# Part-fan PWM (1-255) during the swap's passive dock waits. 0 = off.
#swap_dwell_fan: 0
# Short nozzle wipe after a bare-T pickup that has no own cleaning move.
# Live: web "Pickup-Cleaning" / ACE_SET_PICKUP_CLEANING ENABLE=0|1
pickup_cleaning: false
# ACE 2 feed assist while printing, defaults are fine.
#   v2_print_assist_mode: constant   # constant (default) | tracked (legacy)
#   v2_constant_assist_speed: 0      # 0 = ACE firmware default; >0 = pin once
#   v2_assist_confirm_time: 0.5      # s a reverse must hold before unwind flip

# ===== Heads and slicer tools =====
# Manual heads (hand-fed, no MMU motion; the head sensor stays active).
# Boot default only, the web "Manual" checkbox / ACE_SET_HEAD_MANUAL
# HEAD=n ENABLE=0|1 is saved on the printer and wins.
#head_manual_0: False
#head_manual_1: False
#head_manual_2: False
#head_manual_3: False
# Legacy boot default for the MMU-driven head in 'head' mode (0-based).
# The mode itself: SET_ACE_MODE MODE=normal|multi|head [HEAD=n] / web.
#ace_head: 3
# Virtual slicer tools (Orca profile with one filament per slot): tools
# 0-3 are the heads as loaded, tool n >= 4 = MMU (n-4)//4, slot (n-4)%4
# unless listed here as tool=ace:slot (0-based).
# Live: web Config tab / ACE_SET_TOOL TOOL=n ACE=a SLOT=s [RESET=1]
#tool_map:

# ===== Preflight =====
# Max targets per slicer colour (1..4). 2+ = a second spool of the same
# colour on another head cuts swaps. Live: web / ACE_SET_PREFLIGHT_COPIES MAX=n
preflight_max_copies: 1
# Copies only on an exact hex match (false = colour-name tiers count too).
# Live: web checkbox / ACE_SET_PREFLIGHT_COPIES STRICT=0|1
preflight_copies_strict: false

# ===== Spools =====
# Spool world: local (table + booking on the printer), spoolman (we set
# identities and count against Spoolman), spoollink (paxx SpoolLink sets
# and counts; we bind and show). spoolman/spoollink need spoolman_url.
# Live: web Config tab / ACE_SET_SPOOLMAN MODE=
#spool_mode: local
# Local spool table (remaining weight is an estimate, not a scale).
#spool_db: /home/lava/printer_data/config/persistent/multiace_spools.json
# Spoolman leads once a URL is set (import overrides local data,
# consumption is reported back). Live: web / ACE_SET_SPOOLMAN URL= AUTO=0|1
spoolman_url:
spoolman_auto_sync: false
# true = the stock flow routine's PA is captured onto the bound spool and
# the stored per-spool PA is applied on toolchange; false = slicer value.
# Live: web "PA sync" / ACE_SET_PA_SYNC ENABLE=0|1
pa_sync: true
# Defaults for ACE_TAG_WRITE / the picker's "write to tag": format
# openspool (NDEF, readable through the RC522 tunnel only) or anycubic
# (every ACE reads it); uid_sku true = card UID as SKU, false = the bound
# spool's SKU. Live: web Config tab / ACE_SET_TAG_WRITE FORMAT= UID_SKU=
#tag_write_format: openspool
#tag_write_uid_sku: true

# ===== Drying =====
# Upper limit for any drying temperature, defaults of the dry macros
# (temperature in C, duration in minutes).
max_dryer_temperature: 70
dryer_temp: 55
dryer_duration: 240
# Humidity-controlled drying. Only an ACE 2 measures; an ACE Pro can only
# follow a master (picked per unit in the web drying panel). Defaults here,
# per-unit overrides via ACE_SET_AUTO_DRY (web drying panel).
#auto_dry: false
#auto_dry_rh_start: 45          # ACE 2: start drying above this %rH
#auto_dry_rh_end: 35            # ACE 2: stop below it (must be BELOW rh_start)
#auto_dry_temp: 50              # own drying temperature (ACE 2 and ACE Pro)
#auto_dry_add_time: 60          # follower keeps drying this long after master
#auto_dry_while_printing: false
# Spool rotation during drying, ACE 2 only. Anycubic ships it off because
# their routine is blind: 5 mm reverse feed every ~4 min on every active
# slot, so a long cycle walks a parked tip backwards out of the tube.
# Turn on only with empty lanes.
#dry_auto_roll: false
# Exhaust flap during drying, ACE 2 only: s between confirmed dryer start
# and opening (0 = leave the flap alone). Closed again on every stop.
#dry_exhaust_delay: 20

# ===== Print safety =====
# Pause on repeated back-pressure suspects; warnings always log.
# Live: web "Air-Print Detection".
resistance_pause: false
# Runout failover from a same-identity backup slot + auto-RESUME.
# Live: web "Quad Replenish" / ACE_SET_QUAD_REPLENISH ENABLE=0|1
quad_replenish: false
# Quad before stock's head-switch replenish (false = stock first).
# Live: ACE_SET_QUAD_REPLENISH FIRST=0|1
quad_first: true
# Web UI asks back before load/unload actions (web only, never gcode/display).
# Live: web "Confirm commands" / ACE_SET_CONFIRM_COMMANDS ENABLE=0|1
confirm_commands: false
# Multi-MCU homing window in seconds (0003-0528 "Communication timeout
# during homing"). 0 = stock value from mcu.py. A value only raises, e.g.
# 0.250; restart Klipper after a change.
#trsync_timeout: 0

# ===== Debug =====
# Extra log channels: state machine, USB, feed assist.
state_debug: false
usb_debug: false
fa_debug: false
# Diagnostic samplers: airlog = coil flow sampler, stall_watchdog =
# reactor-stall watchdog.
#airlog: false
#stall_watchdog: false

# Moonraker access of the macro layout (see macro_layout_enabled).

[ace_macro_layout]
moonraker_url: http://127.0.0.1:7125
request_timeout: 5
watch_window: 1800
poll_interval: 30

[gcode_macro SET_ACE_MODE]
description: Switch mode. Usage: SET_ACE_MODE MODE=normal|multi|head [HEAD=n]
gcode:
  {% set mode = params.MODE|default('')|lower %}
  {% if mode not in ['normal', 'single', 'multi', 'head'] %}
    {action_respond_info("ERROR: Use SET_ACE_MODE MODE=normal, multi, or head [HEAD=n]")}
  {% else %}
    {% set current = printer.save_variables.variables.get('ace__mode', 'normal') %}
    {% if current == mode %}
      {action_respond_info("Already in %s mode (re-syncing)..." % mode|upper)}
    {% else %}
      {action_respond_info("Switching to %s mode..." % mode|upper)}
    {% endif %}
    {% set needs_unload = (current in ['single', 'multi', 'head'] and mode == 'normal') or (current == 'normal' and mode in ['single', 'multi', 'head']) %}
    {% if needs_unload %}
      {% set e0 = printer['filament_motion_sensor e0_filament'].filament_detected %}
      {% set e1 = printer['filament_motion_sensor e1_filament'].filament_detected %}
      {% set e2 = printer['filament_motion_sensor e2_filament'].filament_detected %}
      {% set e3 = printer['filament_motion_sensor e3_filament'].filament_detected %}
      {% set loaded = [] %}
      {% if e0 %}{% set _ = loaded.append('E0') %}{% endif %}
      {% if e1 %}{% set _ = loaded.append('E1') %}{% endif %}
      {% if e2 %}{% set _ = loaded.append('E2') %}{% endif %}
      {% if e3 %}{% set _ = loaded.append('E3') %}{% endif %}
      {% if loaded|length > 0 %}
        {action_respond_info("Cannot switch mode! Filament still loaded in: %s" % loaded|join(', '))}
        {action_respond_info("Please unload all toolheads first, then try again.")}
      {% else %}
        ACE_RUN_MODE_SWITCH MODE={mode}{% if params.HEAD is defined %} HEAD={params.HEAD}{% endif %}
      {% endif %}
    {% else %}
      ACE_RUN_MODE_SWITCH MODE={mode}{% if params.HEAD is defined %} HEAD={params.HEAD}{% endif %}
    {% endif %}
  {% endif %}
