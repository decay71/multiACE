[save_variables]
filename: /home/lava/printer_data/config/extended/multiace/ace_vars.cfg
[ace]
ace_device_count: 1
enable_ace_v2: true
v2_order: first

# Extra USB vid:pid accepted as an ACE 2 - only for a generic USB-RS485
# adapter in place of the genuine CH343 cable. Leave unset otherwise
# (CH340 is a generic chip and would match unrelated devices).
#v2_extra_usb_ids: 1a86:7523


update_url_base: https://postapocalyptic-diy.com/software/updates


language: en
display_index_base: 1

# Feature toggles (ACE_SET_* / web) WRITE their config line here directly
# (write-through) - this file is the only store. PERSIST=0 on a setter =
# RAM only until restart. Exceptions: mode + head wiring + auto_dry
# per-unit overrides stay in save_variables.

# Upload cap (MB) of the "Send to multiACE" slicer inbox.
#inbox_max_mb: 256

# Spool world: local (table + booking on the printer), spoolman (we set
# identities and count against Spoolman), spoollink (paxx SpoolLink sets
# and counts; we bind and show). spoolman/spoollink need spoolman_url.
# Normally set from the web config tab (ACE_SET_SPOOLMAN MODE=).
#spool_mode: local

state_debug: false
usb_debug: false
fa_debug: false
# Diagnostic samplers, debug only: airlog = coil flow sampler,
# stall_watchdog = reactor-stall watchdog.
#airlog: false
#stall_watchdog: false

# Pause on repeated back-pressure suspects; warnings always log.
# Live: web "Air-Print Detection". Code default: false.
resistance_pause: false

# Runout failover from a same-identity backup SLOT + auto-RESUME.
# Live: web "Quad Replenish" / ACE_SET_QUAD_REPLENISH ENABLE=0|1
quad_replenish: false

# Quad before stock's head-switch replenish (false = stock first).
# Live: ACE_SET_QUAD_REPLENISH FIRST=0|1
quad_first: true

# Local spool table (remaining weight is an estimate, not a scale).
# Manage via the web UI or ACE_SPOOL_ADD/_SET/_ASSIGN/_DELETE/_LIST. Path:
#spool_db: /home/lava/printer_data/config/persistent/multiace_spools.json

# Short nozzle wipe after a bare-T pickup that has no own cleaning move.
# Live: web "Pickup-Cleaning" / ACE_SET_PICKUP_CLEANING ENABLE=0|1
pickup_cleaning: false

# Web UI asks back before load/unload actions (web only, never gcode/display).
# Live: web "Confirm commands" / ACE_SET_CONFIRM_COMMANDS ENABLE=0|1
confirm_commands: false

# Humidity-controlled drying. Only an ACE 2 measures; an ACE Pro can only
# FOLLOW a master (picked per unit in the web drying panel). These are the
# defaults; per-unit overrides via ACE_SET_AUTO_DRY (web drying panel).
#auto_dry: false
#auto_dry_rh_start: 45          # ACE 2: start drying above this %rH
#auto_dry_rh_end: 35            # ACE 2: stop below it (must be BELOW rh_start)
#auto_dry_temp: 50              # own drying temperature (ACE 2 and ACE Pro)
#auto_dry_add_time: 60          # follower keeps drying this long after master
# auto_dry_master is obsolete - still read so old configs do not halt.
#auto_dry_while_printing: false
# Exhaust flap during drying, ACE 2 only: s between confirmed dryer start
# and opening (0 = leave the flap alone). Closed again on every stop.
#dry_exhaust_delay: 20

# Spoolman as source of truth once a URL is set (import overrides local
# data, consumption is reported back). Live: web / ACE_SET_SPOOLMAN URL= AUTO=0|1
spoolman_url:
spoolman_auto_sync: false

baud: 115200
feed_speed: 80
# Hot seat press after the load heat: pushes the sensor-stopped tip into
# the extruder gear nip. Also bounds the bg engine's V1 press. 0 = off.
seat_overshoot_length: 30
retract_speed: 80

retract_length: 1950
load_length: 2100

# Manual / TPU heads: hand-fed, no ACE motion; the head sensor stays active.
# Live: web "Manual" checkbox / ACE_SET_HEAD_MANUAL HEAD=n ENABLE=0|1
#head_manual_0: False
#head_manual_1: False
#head_manual_2: False
#head_manual_3: False

# Boot default for the ACE-driven head in 'head' mode (0-based).
# The mode itself: SET_ACE_MODE MODE=normal|multi|head [HEAD=n] / web Config tab.
#ace_head: 3

load_retry: 3
load_retry_retract: 50

extrusion_retry: 7
extrusion_retry_retract: 30
extrusion_retry_retract_a: 50
wiggle_scheme: EAEAEAE

unload_retry: 3

max_dryer_temperature: 70
dryer_temp: 55
dryer_duration: 240

swap_default_temp: 250
swap_retract_length: 900
swap_purge_length: 0

# false = ignore the preflight's per-pair purge stamps, fixed purge again
# (also on already-stamped files). Live: ACE_SET_PURGE MATRIX=0|1 writes
# THIS line (write-through); add PERSIST=0 for RAM-only until restart.
purge_matrix: true

# Part-fan PWM (1-255) during the swap's passive dock waits - dwell-heat-
# soak mitigation test. 0 = off.
#swap_dwell_fan: 0

v2_feed_check_check_length: 254
v2_feed_check_error_length: 254

# V2 print-time feed assist - defaults are fine.
#   v2_print_assist_mode: constant   # constant (default) | tracked (legacy)
#   v2_constant_assist_speed: 0      # 0 = ACE firmware default; >0 = pin once
#   v2_assist_confirm_time: 0.5      # s a reverse must hold before unwind flip

[gcode_macro SET_ACE_MODE]
description: Switch mode. Usage: SET_ACE_MODE MODE=normal|multi|head [HEAD=n]
gcode:
  {% set mode = params.MODE|default('')|lower %}
  {% if mode not in ['normal', 'single', 'multi', 'head'] %}
    {action_respond_info("ERROR: Use SET_ACE_MODE MODE=normal, multi, or head [HEAD=n]")}
  {% else %}
    {% set current = printer.save_variables.variables.get('ace__mode', 'normal') %}
    {% if current == mode %}
      {action_respond_info("Already in %s mode (re-syncing)..." % mode|upper)}
    {% else %}
      {action_respond_info("Switching to %s mode..." % mode|upper)}
    {% endif %}
    {% set needs_unload = (current in ['single', 'multi', 'head'] and mode == 'normal') or (current == 'normal' and mode in ['single', 'multi', 'head']) %}
    {% if needs_unload %}
      {% set e0 = printer['filament_motion_sensor e0_filament'].filament_detected %}
      {% set e1 = printer['filament_motion_sensor e1_filament'].filament_detected %}
      {% set e2 = printer['filament_motion_sensor e2_filament'].filament_detected %}
      {% set e3 = printer['filament_motion_sensor e3_filament'].filament_detected %}
      {% set loaded = [] %}
      {% if e0 %}{% set _ = loaded.append('E0') %}{% endif %}
      {% if e1 %}{% set _ = loaded.append('E1') %}{% endif %}
      {% if e2 %}{% set _ = loaded.append('E2') %}{% endif %}
      {% if e3 %}{% set _ = loaded.append('E3') %}{% endif %}
      {% if loaded|length > 0 %}
        {action_respond_info("Cannot switch mode! Filament still loaded in: %s" % loaded|join(', '))}
        {action_respond_info("Please unload all toolheads first, then try again.")}
      {% else %}
        ACE_RUN_MODE_SWITCH MODE={mode}{% if params.HEAD is defined %} HEAD={params.HEAD}{% endif %}
      {% endif %}
    {% else %}
      ACE_RUN_MODE_SWITCH MODE={mode}{% if params.HEAD is defined %} HEAD={params.HEAD}{% endif %}
    {% endif %}
  {% endif %}
