[save_variables]
filename: /home/lava/printer_data/config/extended/multiace/ace_vars.cfg

[ace]
# multiACE settings. Switches set in the web or by ACE_SET_* write their
# line in this file (PERSIST=0 = until restart only). Mode, head wiring
# and per-unit auto-dry live in save_variables. Units are found and
# placed on their own (web: Config -> Devices).

# ===== Drivers and ports =====
#   enable_ace_v1         ACE Pro driver
#   enable_ace_v2         ACE 2 driver
#   enable_cfs            Creality CFS Nano driver (untested, no feed assist)
#   cfs_usb_ids           USB id of the CFS Nano dongle
#   v2_extra_usb_ids      extra USB ids taken as an ACE 2 (RS485 adapter)
#   v2_probe_generic_usb  probe generic RS485 adapters for an ACE 2
#   exclude_ports         /dev paths never opened ([mcu] ports always are)
#   startup_wait          s to wait for the units at start (0 = no wait)
# A driver that is off probes and connects nothing. With enable_cfs on,
# leave v2_extra_usb_ids and v2_probe_generic_usb unset.
#enable_ace_v1: true
enable_ace_v2: true
#enable_cfs: false
#cfs_usb_ids: 1a86:7523
#v2_extra_usb_ids: 1a86:7523
#v2_probe_generic_usb: true
#exclude_ports: /dev/serial/by-id/usb-foo
#startup_wait: 20.0

# ===== Language and display =====
#   language              en | de | zh (also in the web)
#   display_index_base    1 = MMU, slot and head count from 1 in UI and
#                         messages; G-code parameters always count from 0
#   macro_layout_enabled  false = keep your own Fluidd/Mainsail macro layout
#   inbox_max_mb          upload cap of the "Send to multiACE" slicer inbox
language: en
display_index_base: 1
macro_layout_enabled: true
#inbox_max_mb: 256

# ===== Load and unload =====
#   feed_speed, retract_speed  mm/s (the ACE 2 takes at most 100)
#   load_length           mm from the MMU to the toolhead sensor
#   retract_length        mm pulled back on a full unload
#   seat_overshoot_length hot press of the tip into the gears (0 = off)
#   load_feed_temp_drop   C below load temp the nozzle waits at while the
#                         MMU feeds (stock 50; 0 = stay at load temp)
#   unload_cut_macro      gcode macro that cuts the filament at the toolhead
#                         (cutter mod), called instead of the tip forming,
#                         gets HEAD=n; background unloads then run inline
#   unload_cut_heads      heads with a cutter, e.g. 1,2 (empty = all), the
#                         others keep the normal tip forming
#   load_retry            feed attempts until the toolhead sensor triggers
#   load_retry_retract    mm pulled back between them
#   extrusion_retry       flow check retries after the load
#   extrusion_retry_retract, extrusion_retry_retract_a  mm pulled back per
#                         retry, E = extruder only, A = with MMU push
#   wiggle_scheme         E or A per retry
#   unload_retry          verified unload attempts before the print pauses
#   v2_feed_check_check_length, v2_feed_check_error_length  ACE 2 jam
#                         check in mm (3-254, error <= check)
# Lengths per unit or slot: [ace N] sections, written by the Calibration tab.
feed_speed: 80
retract_speed: 80
load_length: 2100
retract_length: 1950
seat_overshoot_length: 30
#load_feed_temp_drop: 50
#unload_cut_macro: CUT
#unload_cut_heads: 1,2
load_retry: 3
load_retry_retract: 50
extrusion_retry: 7
extrusion_retry_retract: 30
extrusion_retry_retract_a: 50
wiggle_scheme: EAEAEAE
unload_retry: 3
v2_feed_check_check_length: 254
v2_feed_check_error_length: 254

# ===== Swap =====
#   swap_default_temp     swap heat when print and material give none
#   swap_retract_length   mm pulled back on a swap (0 = retract_length)
#   swap_purge_length     fixed purge after a swap load (0 = stock 80 mm)
#   purge_matrix          false = ignore the preflight's per-pair purge
#                         (ACE_SET_PURGE MATRIX=0|1)
#   swap_purge_scale      percent on every resolved purge length (25-200)
#   swap_purge_floor      smallest purge in mm, for the preflight's per-pair
#                         purge and every swap (0 = 40 mm)
#   swap_purge_cap        maximum purge in mm, 0 = off
#                         (ACE_SET_PURGE SCALE=|FLOOR=|CAP=, live; the floor
#                         reaches the per-pair purge with the next preflight)
#   swap_dwell_fan        part fan PWM 1-255 while the head waits at the
#                         dock (0 = off)
#   pickup_cleaning       nozzle wipe after a bare pickup (also in the web)
#   v2_print_assist_mode, v2_constant_assist_speed, v2_assist_confirm_time
#                         ACE 2 feed assist while printing, keep defaults
swap_default_temp: 250
swap_retract_length: 900
swap_purge_length: 0
purge_matrix: true
swap_purge_scale: 100
swap_purge_floor: 0
swap_purge_cap: 0
#swap_dwell_fan: 0
pickup_cleaning: false
#v2_print_assist_mode: constant
#v2_constant_assist_speed: 0
#v2_assist_confirm_time: 0.5

# ===== Heads and slicer tools =====
#   head_manual_0..3      hand-fed head at boot; the web "Manual" box wins
#   ace_head              old boot default of the MMU head in head mode
#   tool_map              slicer tool -> MMU slot, e.g. 5=1:0 (0-based);
#                         unlisted tool n >= 4 = MMU (n-4)//4, slot (n-4)%4
# The mode itself is set with SET_ACE_MODE or in the web.
#head_manual_0: False
#head_manual_1: False
#head_manual_2: False
#head_manual_3: False
#ace_head: 3
#tool_map:

# ===== Preflight =====
#   preflight_max_copies  targets per slicer colour (1-4); 2+ lets a second
#                         spool of the same colour on another head save swaps
#   preflight_copies_strict  copies on an exact colour match only
preflight_max_copies: 1
preflight_copies_strict: false

# ===== Spools =====
#   spool_mode            local | spoolman | spoollink (also in the web)
#   spool_db              local spool table
#   spoolman_url          Spoolman address; once set, Spoolman leads
#   spoolman_auto_sync    sync with Spoolman after each print
#   pa_sync               keep pressure advance per spool
#   remember_filament     true = a slot that goes empty keeps its hand-set
#                         label and spool binding (a fresh RFID read still
#                         replaces it; ACE_SET_REMEMBER_FILAMENT, live)
#   tag_write_format      openspool | anycubic, for "write to tag"
#   tag_write_uid_sku     true = card UID as SKU, false = the spool's SKU
#spool_mode: local
#spool_db: /home/lava/printer_data/config/persistent/multiace_spools.json
spoolman_url:
spoolman_auto_sync: false
pa_sync: true
remember_filament: false
#tag_write_format: openspool
#tag_write_uid_sku: true

# ===== Drying =====
#   max_dryer_temperature upper limit for any drying temperature
#   dryer_temp, dryer_duration  defaults of the dry macros (C, minutes)
#   auto_dry              humidity-controlled drying (per unit in the web)
#   auto_dry_rh_start, auto_dry_rh_end  start above / stop below this %rH
#                         (ACE 2 measures, an ACE Pro follows a master)
#   auto_dry_temp         drying temperature
#   auto_dry_add_time     minutes a follower keeps drying after the master
#   auto_dry_while_printing  allow it during a print
#   dry_auto_roll         spool rotation while drying, ACE 2, empty lanes
#                         only (it walks a parked tip out of the tube)
#   dry_exhaust_delay     s until the ACE 2 exhaust flap opens (0 = leave it)
max_dryer_temperature: 70
dryer_temp: 55
dryer_duration: 240
#auto_dry: false
#auto_dry_rh_start: 45
#auto_dry_rh_end: 35
#auto_dry_temp: 50
#auto_dry_add_time: 60
#auto_dry_while_printing: false
#dry_auto_roll: false
#dry_exhaust_delay: 20

# ===== Print safety =====
#   resistance_pause      Air-Print Detection: pause on repeated
#                         back-pressure (also in the web)
#   quad_replenish        runout: reload from a slot with the same filament
#   quad_first            try that before stock's head switch
#   confirm_commands      web asks back before load/unload
#   trsync_timeout        multi-MCU homing window in s, only raises
#                         (0 = stock; for 0003-0528 homing timeouts)
resistance_pause: false
quad_replenish: false
quad_first: true
confirm_commands: false
#trsync_timeout: 0

# ===== Debug =====
#   state_debug, usb_debug, fa_debug  extra log channels
#   airlog                coil flow sampler
#   stall_watchdog        reactor stall watchdog
state_debug: false
usb_debug: false
fa_debug: false
#airlog: false
#stall_watchdog: false

# Moonraker access of the macro layout (macro_layout_enabled).
[ace_macro_layout]
moonraker_url: http://127.0.0.1:7125
request_timeout: 5
watch_window: 1800
poll_interval: 30

# ===== Tip forming per material =====
#   mode                  stock = firmware pull | custom = the tables below
#   <key>: <table>        key = pla, petg, ... | vendor_material (sunlu_pla)
#                         | soft | default, looked up in that order
#   <key>@<driver>        same, only for heads fed by that driver
#                         (ace_v1, ace_v2, cfs), tried first: pla@cfs
# Steps: <mm>@<feedrate> (negative = retract), pause:<ms>, temp:<C>,
#   waittemp:<C> (set + wait), fan:<0-255>
# Parameters: unloadtemp:<C>, loadtemp:<C>, bgtemp:<C> (background load
#   only), bgprimespeed:<mm/min> (background prime feedrate, 60-1200, 240 =
#   the old 4 mm/s), prime:<mm>[@<f>] + primetemp:<C> (hot purge before the
#   tip forms)
# A table must end net-retracted; moves need waittemp >= 175.
# Example: petg: 57@400, 3@1500, -27@2700, -5.5@40, -37.5@1500 (= stock)
# The web editor rewrites this section; comments inside it are lost.
[ace_tipform]
mode: custom
pla: unloadtemp:215, loadtemp:215
petg: unloadtemp:240, loadtemp:240
petg-cf: unloadtemp:245, loadtemp:245
petg-hf: unloadtemp:240, loadtemp:240
asa: unloadtemp:255, loadtemp:255

[ace_bg_swap]
# ===== Background swapping (head mode) =====
# Unloads or swaps a parked head while another one prints.
#   heads                 heads allowed to do it, e.g. 0,1,2,3. Only heads
#                         whose dock is open below, the cold pull
#                         purges through it (web: BG box)
#   load_enabled          True = full swap | False = unload only, load on
#                         arrival | transport = unload + feed to the
#                         sensor, grip and prime on arrival (no open dock)
#   pick_gate             no flow on arrival pauses (False = log only)
#   arrival_wait          wait for a running background op before the
#                         toolchange (False = skip, for comparisons)
#   prime_extra           mm primed on top of the purge length in the
#                         dock, against colour carry-over (0-100)
#   prime_speed           prime speed in mm/s through the open dock (soft
#                         filament always uses 4); 4 = the old speed, 6
#                         saves ~12 s per swap, off until tried on hardware
#   pull_early_start      the cold pull starts this many degrees below its
#                         temperature, its opening push is slow (0 = wait
#                         for all); off until tried on hardware, 10 saves
#                         ~2.5 s per swap
#   pull_push             length of the pull's opening push in mm (0 = the
#                         stock 57), built-in table only
#   swap_queue            a stamped swap that finds another background op
#                         running starts when that one ends (False = skipped,
#                         inline swap); off until tried on hardware
#   debug                 show arrival decisions in the console
#   prime_scale           scaling factor applied only to the background prime
#                         before purge policy (e.g. 0.40 = 40% of purge length,
#                         still respecting floor/cap; default 1.0)
#heads: 3
#load_enabled: True
#pick_gate: True
#arrival_wait: True
#prime_extra: 40
#prime_scale: 1.0
#prime_speed: 4
#pull_early_start: 0
#pull_push: 0
#swap_queue: False
#debug: False

# ===== Macros (shipped, do not edit) =====

[gcode_macro SET_ACE_MODE]
description: Switch mode. Usage: SET_ACE_MODE MODE=normal|multi|head [HEAD=n]
gcode:
  {% set mode = params.MODE|default('')|lower %}
  {% if mode not in ['normal', 'single', 'multi', 'head'] %}
    {action_respond_info("ERROR: Use SET_ACE_MODE MODE=normal, multi, or head [HEAD=n]")}
  {% else %}
    {% set current = printer.save_variables.variables.get('ace__mode', 'normal') %}
    {% if current == mode %}
      {action_respond_info("Already in %s mode (re-syncing)..." % mode|upper)}
    {% else %}
      {action_respond_info("Switching to %s mode..." % mode|upper)}
    {% endif %}
    {% set needs_unload = (current in ['single', 'multi', 'head'] and mode == 'normal') or (current == 'normal' and mode in ['single', 'multi', 'head']) %}
    {% if needs_unload %}
      {% set e0 = printer['filament_motion_sensor e0_filament'].filament_detected %}
      {% set e1 = printer['filament_motion_sensor e1_filament'].filament_detected %}
      {% set e2 = printer['filament_motion_sensor e2_filament'].filament_detected %}
      {% set e3 = printer['filament_motion_sensor e3_filament'].filament_detected %}
      {% set loaded = [] %}
      {% if e0 %}{% set _ = loaded.append('E0') %}{% endif %}
      {% if e1 %}{% set _ = loaded.append('E1') %}{% endif %}
      {% if e2 %}{% set _ = loaded.append('E2') %}{% endif %}
      {% if e3 %}{% set _ = loaded.append('E3') %}{% endif %}
      {% if loaded|length > 0 %}
        {action_respond_info("Cannot switch mode! Filament still loaded in: %s" % loaded|join(', '))}
        {action_respond_info("Please unload all toolheads first, then try again.")}
      {% else %}
        ACE_RUN_MODE_SWITCH MODE={mode}{% if params.HEAD is defined %} HEAD={params.HEAD}{% endif %}
      {% endif %}
    {% else %}
      ACE_RUN_MODE_SWITCH MODE={mode}{% if params.HEAD is defined %} HEAD={params.HEAD}{% endif %}
    {% endif %}
  {% endif %}

