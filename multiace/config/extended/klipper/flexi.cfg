# @MULTIACE_FLEXI_HOOK Flexi-owned optional configuration. Original
# MultiACE modes do not depend on it.
# SPDX-License-Identifier: GPL-3.0-or-later
# MultiACE Flexi plugin - optional and independently removable.
#
# Loaded by the existing OEM include line:
#   [include extended/klipper/*.cfg]
#
# Removing this file removes the plugin. It does not edit printer.cfg,
# [ace] or any OEM configuration, and it executes no movement.
[flexi]
enabled: True
# When True, Klipper refuses to start if [ace] is absent. Default False keeps
# a missing MultiACE a reported, non-fatal condition.
require_multiace: False
# When True, the version-pinned H1 boundary adapter must install against the
# pinned MultiACE send_request_to source, or Klipper refuses to start. Set
# False for read-only status with original MultiACE behavior.
enforce: True
# H2 movement authorization is independent of the H1 ACE boundary. It covers
# only MultiACE-owned Klipper movement that has been explicitly instrumented;
# the current stage covers MultiAce._run_tipform. Set False to retain H1 only.
enforce_h2: True
