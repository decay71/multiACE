# TEST_BG_SWAP_BENCH & TEST_BG_SWAP_INTERRUPT
# Test macros for Milestone 2 bench testing and interruption verification.

[gcode_macro TEST_BG_SWAP_BENCH]
description: Dry-run test harness for background swaps and arrival holds (Milestone 2)
gcode:
  {% set active_head = params.ACTIVE_HEAD|default(1)|int %}
  {% set target_head = params.TARGET_HEAD|default(0)|int %}
  {% set target_slot = params.TARGET_SLOT|default(0)|int %}
  {% set simulate = params.SIMULATE|default(0)|int %}
  {action_respond_info("[bench-test] Starting TEST_BG_SWAP_BENCH: ACTIVE_HEAD=%d, TARGET_HEAD=%d, TARGET_SLOT=%d, SIMULATE=%d" % (active_head, target_head, target_slot, simulate))}
  
  # Step 1: Ensure toolhead is homed
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_respond_info("[bench-test] Printer axes not homed; homing X Y Z...")}
    G28
  {% endif %}
  
  # Step 2: Pick up active head and move to safe resting coordinates
  {action_respond_info("[bench-test] Selecting active toolhead T%d..." % active_head)}
  T{active_head}
  G90
  {action_respond_info("[bench-test] Moving active toolhead to safe rest position (MOVE_TO_DISCARD_FILAMENT_POSITION)...")}
  MOVE_TO_DISCARD_FILAMENT_POSITION
  
  # Step 3: Ensure target head is background-swap enabled
  {action_respond_info("[bench-test] Opting in target head %d for background swap..." % target_head)}
  ACE_BG_SET_HEAD HEAD={target_head} ENABLE=1 PERSIST=0
  
  # Step 4: Dispatch background swap on docked target head (or simulate)
  {% if simulate == 1 %}
    {action_respond_info("[bench-test] SIMULATE=1: Bypassing physical ACE_BG_SWAP heating and extruder motors.")}
  {% else %}
    {action_respond_info("[bench-test] Dispatching physical ACE_BG_SWAP on HEAD=%d SLOT=%d..." % (target_head, target_slot))}
    ACE_BG_SWAP HEAD={target_head} SLOT={target_slot} FORCE=1
  {% endif %}
  
  # Step 5: Test non-blocking arrival hold macro skeleton
  {action_respond_info("[bench-test] Triggering ACE_BG_WAIT HEAD=%d..." % target_head)}
  ACE_BG_WAIT HEAD={target_head}
  
  # Step 6: Console state summary instructions
  {% if simulate == 1 %}
    {action_respond_info("[bench-test] SIMULATE=1 bench run complete! Toolhead pickup, parking, and arrival hold verified.")}
  {% else %}
    {action_respond_info("[bench-test] Harness executed successfully! Use 'ACE_BG_STATUS' or watch console for live state transitions.")}
  {% endif %}



# -----------------------------------------------------------------------------
# Background Swap Interruption Test Suite (Milestone 2 Harness)
# Usage:
#   TEST_BG_SWAP_INTERRUPT ACTIVE_HEAD=1 TARGET_HEAD=0 TARGET_SLOT=0 AT=PULL [DELAY=2.0]
#
# Supported AT= phases & expected handover behavior:
#   HEAT      - Interrupt during nozzle warmup. Aborts heat greenlet, heater shut
#               off; arrival T executes standard inline unload + swap.
#   PULL      - Interrupt mid-cold-pull choreography. Engine catches pickup between
#               pull moves, shuts off hotend; arrival T runs inline unload recovery.
#   RETRACT   - Interrupt during ACE bulk rollback. MultiACE interlock holds T until
#               motor stops, then hands over safely.
#   BOOKKEEP  - (Empty head window) Interrupt after old strand is fully retracted
#               and head marked empty, but before new feed starts. Arrival T executes
#               clean inline load from scratch.
#   LD_FEED   - Interrupt while filament travels through the bowden tube before
#               reaching toolhead sensor. Feed aborts, filament left staged; arrival T
#               continues load without re-pushing full bowden length.
#   LD_GRIP   - Interrupt while extruder gears grip tip into nozzle. Tip is past
#               gears; head is bookkept loaded; arrival T continues inline.
#   LD_PRIME  - Interrupt mid-purge through dock. Engine aborts dock purge, logs
#               missing mm to _bg_prime_deficit; arrival T tops up prime deficit.
#   DONE      - Await complete swap before pick. Arrival T is an instantaneous no-op.
# -----------------------------------------------------------------------------

[gcode_macro TEST_BG_SWAP_INTERRUPT]
description: Test interrupting a background swap at specific phases (HEAT, PULL, RETRACT, BOOKKEEP, LD_FEED, LD_GRIP, LD_PRIME, DONE)
gcode:
  {% set active_head = params.ACTIVE_HEAD|default(1)|int %}
  {% set target_head = params.TARGET_HEAD|default(0)|int %}
  {% set target_slot = params.TARGET_SLOT|default(0)|int %}
  {% set at = params.AT|default('PULL')|upper %}
  {% set delay = params.DELAY|default(0.0)|float %}
  {action_respond_info("[interrupt-test] Starting TEST_BG_SWAP_INTERRUPT: ACTIVE_HEAD=%d, TARGET_HEAD=%d, TARGET_SLOT=%d, AT=%s, DELAY=%.1fs" % (active_head, target_head, target_slot, at, delay))}
  
  # Log test case intent
  {% if at == 'HEAT' %}
    {action_respond_info("[interrupt-test] Case HEAT: Expecting heat abort -> arrival T unloads inline.")}
  {% elif at == 'PULL' %}
    {action_respond_info("[interrupt-test] Case PULL: Expecting pull abort -> arrival T runs inline unload recovery.")}
  {% elif at == 'RETRACT' %}
    {action_respond_info("[interrupt-test] Case RETRACT: Expecting interlock hold during rollback -> safe handover.")}
  {% elif at == 'BOOKKEEP' %}
    {action_respond_info("[interrupt-test] Case BOOKKEEP: Head empty -> arrival T executes full inline load from scratch.")}
  {% elif at == 'LD_FEED' %}
    {action_respond_info("[interrupt-test] Case LD_FEED: Mid-bowden feed abort -> filament left staged for arrival T.")}
  {% elif at == 'LD_GRIP' %}
    {action_respond_info("[interrupt-test] Case LD_GRIP: Grip abort -> head bookkept loaded; arrival T continues.")}
  {% elif at == 'LD_PRIME' %}
    {action_respond_info("[interrupt-test] Case LD_PRIME: Purge abort -> records _bg_prime_deficit; arrival T tops up prime.")}
  {% elif at == 'DONE' %}
    {action_respond_info("[interrupt-test] Case DONE: Full swap completed -> arrival T is instantaneous no-op.")}
  {% endif %}

  # Step 1: Ensure toolhead is homed
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_respond_info("[interrupt-test] Printer axes not homed; homing X Y Z...")}
    G28
  {% endif %}

  # Step 2: Pick up active head and move to safe resting coordinates
  {action_respond_info("[interrupt-test] Selecting active toolhead T%d..." % active_head)}
  T{active_head}
  G90
  {action_respond_info("[interrupt-test] Moving active toolhead to safe rest position (MOVE_TO_DISCARD_FILAMENT_POSITION)...")}
  MOVE_TO_DISCARD_FILAMENT_POSITION

  # Step 3: Ensure target head is background-swap enabled
  {action_respond_info("[interrupt-test] Opting in target head %d for background swap..." % target_head)}
  ACE_BG_SET_HEAD HEAD={target_head} ENABLE=1 PERSIST=0

  # Step 4: Dispatch background swap on docked target head
  {action_respond_info("[interrupt-test] Dispatching ACE_BG_SWAP on HEAD=%d SLOT=%d..." % (target_head, target_slot))}
  ACE_BG_SWAP HEAD={target_head} SLOT={target_slot} FORCE=1

  # Step 5: Await target phase
  {action_respond_info("[interrupt-test] Waiting for background swap to reach phase %s..." % at)}
  ACE_BG_AWAIT_PHASE HEAD={target_head} PHASE={at} TIMEOUT=120

  # Step 6: Optional dwell mid-phase before interrupting
  {% if delay > 0.0 %}
    {action_respond_info("[interrupt-test] Dwelling %.1fs mid-phase before pick..." % delay)}
    G4 P{ (delay * 1000)|int }
  {% endif %}

  # Step 7: Trigger the interruption by picking up the target head
  {action_respond_info("[interrupt-test] INTERRUPTING NOW! Issuing T%d..." % target_head)}
  T{target_head}

  {action_respond_info("[interrupt-test] Interruption test completed! Check console for engine handover reactions.")}


# -----------------------------------------------------------------------------
# Background Wait Eligibility Gating Test (Milestone 3 Harness)
# Usage:
#   TEST_BG_WAIT_GATING ACTIVE_HEAD=1 TARGET_HEAD=0 TARGET_SLOT=2 TEST_AFTER_S=10 DEBUG=1
#
# Tests ACE_BG_WAIT eligibility at different points in the background swap:
#   - Early heat (e.g. TEST_AFTER_S=10): Expecting INELIGIBLE (cold, delta > 15C)
#   - Late heat (e.g. TEST_AFTER_S=24): Expecting ELIGIBLE (delta <= 15C)
#   - Pull (e.g. TEST_AFTER_S=35): Expecting ELIGIBLE (PULL active)
# -----------------------------------------------------------------------------

[gcode_macro TEST_BG_WAIT_GATING]
description: Test ACE_BG_WAIT eligibility gating and dynamic thermal setpoint query (Milestone 3)
gcode:
  {% set active_head = params.ACTIVE_HEAD|default(1)|int %}
  {% set target_head = params.TARGET_HEAD|default(0)|int %}
  {% set target_slot = params.TARGET_SLOT|default(0)|int %}
  {% set test_after_s = params.TEST_AFTER_S|default(10.0)|float %}
  {% set debug = params.DEBUG|default(1)|int %}
  {action_respond_info("[gating-test] Starting TEST_BG_WAIT_GATING: ACTIVE_HEAD=%d, TARGET_HEAD=%d, TARGET_SLOT=%d, TEST_AFTER_S=%.1fs, DEBUG=%d" % (active_head, target_head, target_slot, test_after_s, debug))}

  # Step 1: Ensure toolhead is homed
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_respond_info("[gating-test] Printer axes not homed; homing X Y Z...")}
    G28
  {% endif %}

  # Step 2: Pick up active head and move to safe resting coordinates
  {action_respond_info("[gating-test] Selecting active toolhead T%d..." % active_head)}
  T{active_head}
  G90
  {action_respond_info("[gating-test] Moving active toolhead to safe rest position (MOVE_TO_DISCARD_FILAMENT_POSITION)...")}
  MOVE_TO_DISCARD_FILAMENT_POSITION

  # Step 3: Ensure target head is background-swap enabled
  {action_respond_info("[gating-test] Opting in target head %d for background swap..." % target_head)}
  ACE_BG_SET_HEAD HEAD={target_head} ENABLE=1 PERSIST=0

  # Step 4: Dispatch background swap on docked target head
  {action_respond_info("[gating-test] Dispatching ACE_BG_SWAP on HEAD=%d SLOT=%d..." % (target_head, target_slot))}
  ACE_BG_SWAP HEAD={target_head} SLOT={target_slot} FORCE=1

  # Step 5: Dwell requested duration
  {% if test_after_s > 0.0 %}
    {action_respond_info("[gating-test] Dwelling %.1fs to reach test point..." % test_after_s)}
    G4 P{ (test_after_s * 1000)|int }
  {% endif %}

  # Step 6: Test ACE_BG_WAIT eligibility query
  {action_respond_info("[gating-test] Testing ACE_BG_WAIT HEAD=%d DEBUG=%d..." % (target_head, debug))}
  ACE_BG_WAIT HEAD={target_head} DEBUG={debug}

  {action_respond_info("[gating-test] Gating test finished. Inspect the decision printed above.")}



# -----------------------------------------------------------------------------
# Background Wait Park & Restore Test (Milestone 4 Harness)
# Usage:
#   TEST_BG_WAIT_PARK_RESTORE ACTIVE_HEAD=1 TARGET_HEAD=0 DWELL=3.0 DEBUG=1
#
# Tests Option A self-contained coordinate snapshot, discard park, and restore:
#   - Positions active head at test coordinates (X=150, Y=150, Z=50)
#   - Calls ACE_BG_WAIT FORCE_PARK=1 DWELL=3.0
#   - Verifies active head Z-hops +2mm, travels to discard position, dwells,
#     and smoothly restores itself back to (X=150, Y=150, Z=50).
# -----------------------------------------------------------------------------

[gcode_macro TEST_BG_WAIT_PARK_RESTORE]
description: Test ACE_BG_WAIT Option A self-contained park and restore (Milestone 4)
gcode:
  {% set active_head = params.ACTIVE_HEAD|default(1)|int %}
  {% set target_head = params.TARGET_HEAD|default(0)|int %}
  {% set dwell = params.DWELL|default(3.0)|float %}
  {% set debug = params.DEBUG|default(1)|int %}
  {action_respond_info("[park-test] Starting TEST_BG_WAIT_PARK_RESTORE: ACTIVE_HEAD=%d, TARGET_HEAD=%d, DWELL=%.1fs, DEBUG=%d" % (active_head, target_head, dwell, debug))}

  # Step 1: Ensure toolhead is homed
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_respond_info("[park-test] Printer axes not homed; homing X Y Z...")}
    G28
  {% endif %}

  # Step 2: Pick up active head
  {action_respond_info("[park-test] Selecting active toolhead T%d..." % active_head)}
  T{active_head}

  # Step 3: Move to test position on the bed
  {action_respond_info("[park-test] Moving to test coordinate X=150 Y=150 Z=50 F6000...")}
  G90
  G1 X150 Y150 Z50 F6000

  # Step 4: Call ACE_BG_WAIT with FORCE_PARK=1, RESTORE_POS=1, and DWELL to observe park & restore live
  {action_respond_info("[park-test] Invoking ACE_BG_WAIT HEAD=%d FORCE_PARK=1 RESTORE_POS=1 DWELL=%.1fs DEBUG=%d..." % (target_head, dwell, debug))}
  ACE_BG_WAIT HEAD={target_head} FORCE_PARK=1 RESTORE_POS=1 DWELL={dwell} DEBUG={debug}

  {action_respond_info("[park-test] Park and restore test complete! Verify toolhead has returned to X=150 Y=150 Z=50.")}



# -----------------------------------------------------------------------------
# Background Wait Full Hold and Release Test (Milestone 5 Harness)
# Usage:
#   TEST_BG_WAIT_HOLD ACTIVE_HEAD=1 TARGET_HEAD=0 TARGET_SLOT=3 WAIT_POINT_S=24 DEBUG=1
#
# Verifies full end-to-end arrival hold and release:
#   - Active head holds at discard chute during eligible background cold pull
#   - Waits until target reaches RETRACT
#   - Releases arrival head, restores position, and issues T0 with nozzle already clear!
# -----------------------------------------------------------------------------

[gcode_macro TEST_BG_WAIT_HOLD]
description: Test ACE_BG_WAIT full arrival hold, reactor wait loop, and release (Milestone 5)
gcode:
  {% set active_head = params.ACTIVE_HEAD|default(1)|int %}
  {% set target_head = params.TARGET_HEAD|default(0)|int %}
  {% set target_slot = params.TARGET_SLOT|default(0)|int %}
  {% set wait_point_s = params.WAIT_POINT_S|default(24.0)|float %}
  {% set debug = params.DEBUG|default(1)|int %}
  {action_respond_info("[hold-test] Starting TEST_BG_WAIT_HOLD: ACTIVE_HEAD=%d, TARGET_HEAD=%d, TARGET_SLOT=%d, WAIT_POINT_S=%.1fs, DEBUG=%d" % (active_head, target_head, target_slot, wait_point_s, debug))}

  # Step 1: Ensure toolhead is homed
  {% if "xyz" not in printer.toolhead.homed_axes %}
    {action_respond_info("[hold-test] Printer axes not homed; homing X Y Z...")}
    G28
  {% endif %}

  # Step 2: Pick up active head and move to bed position
  {action_respond_info("[hold-test] Selecting active toolhead T%d..." % active_head)}
  T{active_head}
  G90
  G1 X150 Y150 Z50 F6000

  # Step 3: Ensure target head is background-swap enabled
  {action_respond_info("[hold-test] Opting in target head %d for background swap..." % target_head)}
  ACE_BG_SET_HEAD HEAD={target_head} ENABLE=1 PERSIST=0

  # Step 4: Dispatch background swap on docked target head
  {action_respond_info("[hold-test] Dispatching ACE_BG_SWAP on HEAD=%d SLOT=%d..." % (target_head, target_slot))}
  ACE_BG_SWAP HEAD={target_head} SLOT={target_slot} FORCE=1

  # Step 5: Dwell to reach target hold test point (late heat / pull)
  {% if wait_point_s > 0.0 %}
    {action_respond_info("[hold-test] Dwelling %.1fs to approach arrival point..." % wait_point_s)}
    G4 P{ (wait_point_s * 1000)|int }
  {% endif %}

  # Step 6: Invoke ACE_BG_WAIT (holds at discard until RETRACT)
  {action_respond_info("[hold-test] Invoking ACE_BG_WAIT HEAD=%d (holding at discard until RETRACT)..." % target_head)}
  ACE_BG_WAIT HEAD={target_head} DEBUG={debug}

  # Step 7: Arrival pickup command - target head cold pull is now already finished!
  {action_respond_info("[hold-test] Arrival hold released! Issuing arrival pickup T%d..." % target_head)}
  T{target_head}

  {action_respond_info("[hold-test] Full arrival hold & handover test completed successfully!")}

